name: Release

# Релиз: git tag v2.0.1 && git push origin v2.0.1  -> на GitHub появится Release с MollowLauncher_Setup.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python -c 'from launcher.version import VERSION; print(VERSION)')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build program
        run: |
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --clean --noconsole --onedir --name MollowLauncher --icon assets/icon.ico --add-data "assets;assets" main.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MollowLauncher_Setup
          path: installer_output/MollowLauncher_Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/MollowLauncher_Setup.exe
          generate_release_notes: true
